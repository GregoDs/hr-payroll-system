<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta name="api-base-url" content="http://localhost:3000/api">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PeopleOps HR and payroll operations dashboard">
    <title>PeopleOps — Workforce operations</title>
    <link rel="stylesheet" href="./css/main.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar" aria-label="Application navigation">
        <div class="sidebar__top">
          <a class="wordmark" href="#overview" aria-label="PeopleOps overview">
            <span>people</span>
            <strong>ops</strong>
            <b>.</b>
          </a>
          <button
            class="icon-button nav-toggle"
            id="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="primary-nav"
            aria-label="Open navigation"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </button>
        </div>

        <nav class="primary-nav" id="primary-nav" aria-label="Primary">
          <a href="#overview" data-view-link="overview" aria-current="page">
            <span>01</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 13h6V4H4zM14 20h6V4h-6zM4 20h6v-3H4z"/>
            </svg>
            Overview
          </a>

          <a href="#employees" data-view-link="employees">
            <span>02</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            Employees
          </a>

          <a href="#leave" data-view-link="leave">
            <span>03</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/>
            </svg>
            Leave
          </a>

          <a href="#payroll" data-view-link="payroll">
            <span>04</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h18v10H3zM7 11h.01M17 13h.01M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
            </svg>
            Payroll
          </a>

          <a href="#reports" data-view-link="reports">
            <span>05</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 19V5M4 19h17M8 16V9M13 16V6M18 16v-4"/>
            </svg>
            Reports
          </a>
        </nav>

        <div class="sidebar__footer">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.64 5.64l1.42 1.42M16.94 16.94l1.42 1.42M18.36 5.64l-1.42 1.42M7.06 16.94l-1.42 1.42"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
            <span>Dark mode</span>
          </button>
          <p class="eyebrow">Signed in as</p>
          <strong>Grace Mwangi</strong>
          <span>HR Administrator</span>
          <button class="text-button" type="button" data-demo-action="signout">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            Sign out →
          </button>
        </div>
      </aside>

      <main id="main-content">
        <div id="app-status" class="sr-only" aria-live="polite"></div>
        <div id="views-root" data-page-root></div>
      </main>
    </div>

    <div class="modal-layer" id="modal-layer" hidden>
      <div class="modal-backdrop" data-close-modal></div>

      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal__header">
          <div>
            <p class="eyebrow" id="modal-eyebrow">People operations</p>
            <h2 id="modal-title">Details</h2>
          </div>

          <button
            class="icon-button"
            type="button"
            data-close-modal
            aria-label="Close dialog"
          >
            ×
          </button>
        </header>

        <div class="modal__body" id="modal-body"></div>
      </section>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
